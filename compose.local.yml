services:
  proxy:
    build: .
    container_name: commandcode-proxy
    network_mode: host
    environment:
      HOST: "127.0.0.1"
      PORT: "3050"
    restart: unless-stopped
    user: "node"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
